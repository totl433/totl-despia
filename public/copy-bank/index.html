<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>TOTL Match Center — copy bank</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --line: #e6e6e4;
      --paper: #fff;
      --wash: #f3f3f1;
      --chip: #ececea;
      --right: #1c7a4a;
      --wrong: #9a5b12;
      --right-bg: #f3f8f5;
      --wrong-bg: #fbf6f0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--wash);
    }
    .bar {
      position: sticky; top: 0; z-index: 20;
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 12px 24px;
      display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
    }
    .bar h1 { font-size: 16px; margin: 0; flex: 1 1 220px; }
    .bar label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .bar input[type="text"] {
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; min-width: 140px;
    }
    .bar button, .bar .status {
      border: 1px solid var(--line); background: #fff; border-radius: 8px;
      padding: 6px 10px; font: 13px/1.2 inherit; cursor: pointer;
    }
    .bar .status { color: var(--muted); cursor: default; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 24px 80px; }
    .lede { color: var(--muted); margin: 0 0 28px; max-width: 720px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 36px; }
    nav a { color: var(--ink); font-size: 13px; }
    h2 { font-size: 24px; margin: 56px 0 8px; padding-top: 20px; border-top: 1px solid var(--line); }
    .section-note { color: var(--muted); font-size: 13px; margin: 0 0 28px; }
    .card-block { margin-bottom: 48px; }
    .row { display: flex; gap: 28px; align-items: flex-start; }
    .mock {
      width: 320px; flex-shrink: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .meta { flex: 1; min-width: 0; padding-top: 4px; }
    .meta h3 { margin: 0 0 10px; font-size: 18px; }
    .when { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    .notes { margin-top: 14px; }
    .notes .lbl { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .notes li { margin: 2px 0; font-size: 14px; }
    .mock-h { display: flex; justify-content: space-between; gap: 8px; }
    .strong { font-weight: 600; font-size: 14px; }
    .sub { font-size: 13px; }
    .muted { color: var(--muted); font-size: 12px; }
    .stamp { color: var(--muted); font-size: 12px; }
    .action {
      align-self: flex-start; padding: 6px 10px; background: var(--chip);
      font-size: 12px; font-weight: 600;
    }
    .crest {
      width: 22px; height: 22px; border-radius: 11px; background: var(--chip);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 600;
    }
    .crests { display: flex; gap: 6px; }
    .score { display: flex; align-items: center; gap: 8px; }
    .score .mid { flex: 1; text-align: center; }
    .score .n { font-size: 16px; font-weight: 600; }
    .split { display: flex; gap: 6px; }
    .split div { flex: 1; text-align: center; font-size: 12px; }
    .split b { display: block; font-size: 12px; }
    .barline { height: 4px; margin-top: 4px; background: var(--chip); }
    .league { display: flex; align-items: center; gap: 6px; }
    .footer-chips { display: flex; gap: 6px; }
    .chip { height: 22px; min-width: 28px; padding: 0 8px; background: var(--chip); display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .addc { height: 22px; border: 1px solid var(--line); color: #b0b0b0; font-size: 10px; display: flex; align-items: center; padding: 0 8px; }
    .bank {
      margin-top: 16px; background: var(--paper); border: 1px solid var(--line);
      border-radius: 14px; padding: 16px 18px;
    }
    .bank-h { font-size: 13px; font-weight: 700; margin: 0 0 12px; }
    .cols { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .cols.split { grid-template-columns: 1fr 1fr; }
    .col.right { background: var(--right-bg); padding: 12px; border-radius: 10px; }
    .col.wrong { background: var(--wrong-bg); padding: 12px; border-radius: 10px; }
    .pill {
      display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .03em;
      text-transform: uppercase; padding: 3px 8px; border-radius: 999px; margin-bottom: 8px;
    }
    .pill.right { background: #d9efe3; color: var(--right); }
    .pill.wrong { background: #f3e4cc; color: var(--wrong); }
    .opt { display: grid; grid-template-columns: 28px 1fr 72px; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
    .opt:first-of-type { border-top: none; }
    .letter {
      width: 22px; height: 22px; border-radius: 999px; background: var(--chip);
      display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
    }
    .opt input, .opt textarea, .note-box {
      width: 100%; border: 1px solid transparent; background: transparent;
      font: inherit; color: inherit; resize: vertical; padding: 4px 6px; border-radius: 6px;
    }
    .opt input { font-weight: 600; }
    .opt input:focus, .opt textarea:focus, .note-box:focus { outline: none; border-color: #bbb; background: #fff; }
    .opt textarea { min-height: 38px; }
    .pick { font-size: 11px; color: var(--muted); align-self: start; padding-top: 4px; }
    .pick label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
    .note-box { min-height: 44px; border-color: var(--line); background: #fff; margin-top: 10px; }
    @media (max-width: 800px) {
      .row { flex-direction: column; }
      .mock { width: 100%; max-width: 320px; }
      .cols.split { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <h1>TOTL Match Center — copy bank</h1>
    <label>Your name <input id="who" type="text" placeholder="Tom" /></label>
    <span class="status" id="status">Ready</span>
    <button type="button" id="download">Download my edits</button>
    <button type="button" id="reset">Reset to originals</button>
  </div>
  <div class="wrap">
    <p class="lede">Same layout as the canvas. Click any title or line to change it. Pick A, B or C as the one to use. Add a note under a card if you want. Always say Predictions, never picks. Name is Jof (one F). A is the current live line.</p>
    <nav id="nav"></nav>
    <div id="app"></div>
  </div>

    const KEY = "totl-copy-bank-v1";
    const letters = ["A", "B", "C"];

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; }
    }
    function save(state) {
      localStorage.setItem(KEY, JSON.stringify(state));
      const who = document.getElementById("who").value.trim();
      document.getElementById("status").textContent = who ? "Saved locally · " + who : "Saved locally";
    }

    let state = load();
    if (state.who) document.getElementById("who").value = state.who;

    function cardState(id) {
      if (!state[id]) state[id] = { pick: "A", note: "", values: {} };
      return state[id];
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function mockHtml(parts) {
      return (parts || []).map((p) => {
        if (p.t === "header") {
          return `<div><div class="mock-h"><div class="strong">${esc(p.title)}</div>${p.stamp ? `<div class="stamp">${esc(p.stamp)}</div>` : ""}</div>${p.sub ? `<div class="sub">${esc(p.sub)}</div>` : ""}</div>`;
        }
        if (p.t === "line") return `<div class="${p.strong ? "strong" : ""} ${p.muted ? "muted" : ""}">${esc(p.text)}</div>`;
        if (p.t === "action") return `<div class="action">${esc(p.label)}</div>`;
        if (p.t === "crests") return `<div class="crests">${p.letters.map((l) => `<span class="crest">${esc(l)}</span>`).join("")}</div>`;
        if (p.t === "score") return `<div class="score"><span class="crest">${esc(p.home)}</span><div class="mid"><div class="n">${esc(p.score)}</div><div class="muted">${p.live ? "LIVE " : ""}${esc(p.minute || "")}</div></div><span class="crest">${esc(p.away)}</span></div>`;
        if (p.t === "split") return `<div class="split"><div>H<b>64%</b><div class="barline"></div></div><div>D<b>22%</b><div class="barline"></div></div><div>A<b>14%</b><div class="barline"></div></div></div>`;
        if (p.t === "league") return `<div class="league"><span class="crest">${esc(p.letter)}</span><div style="flex:1">${esc(p.name)}</div>${p.place ? `<div class="strong">${esc(p.place)}</div>` : ""}</div>`;
        if (p.t === "footer") return `<div><div class="footer-chips"><span class="chip">😎</span><span class="chip">🫠</span><span class="chip">🔥</span><span class="chip">+</span></div>${p.comments ? `<div class="muted">${esc(p.comments)}</div>` : ""}<div class="addc">Add your comment</div></div>`;
        return "";
      }).join("");
    }

    function versionsFor(card) {
      if (card.groups) return card.groups;
      return { Copy: card.copy };
    }

    function optHtml(cardId, group, index, version) {
      const cs = cardState(cardId);
      const key = group + ":" + letters[index];
      const stored = cs.values[key] || version;
      const pickKey = group === "Copy" ? letters[index] : group + ":" + letters[index];
      const checked = cs.pick === pickKey ? "checked" : "";
      return `<div class="opt">
        <div class="letter">${letters[index]}</div>
        <div>
          <input data-card="${esc(cardId)}" data-key="${esc(key)}" data-field="title" value="${esc(stored.title)}" />
          <textarea data-card="${esc(cardId)}" data-key="${esc(key)}" data-field="line">${esc(stored.line)}</textarea>
        </div>
        <div class="pick"><label><input type="radio" name="pick-${esc(cardId)}" value="${esc(pickKey)}" ${checked} /> Use this</label></div>
      </div>`;
    }

    function render() {
      const nav = document.getElementById("nav");
      const app = document.getElementById("app");
      nav.innerHTML = DATA.map((s, i) => `<a href="#s${i}">${esc(s.section)}</a>`).join("");
      app.innerHTML = DATA.map((section, i) => {
        const cards = section.cards.map((card) => {
          const groups = versionsFor(card);
          const keys = Object.keys(groups);
          const split = keys.length > 1;
          const cols = keys.map((label) => {
            const tone = label.toLowerCase().includes("wrong") ? "wrong" : (keys.length > 1 ? "right" : "");
            return `<div class="col ${tone}">${keys.length > 1 ? `<div class="pill ${tone}">${esc(label)}</div>` : ""}${groups[label].map((v, idx) => optHtml(card.id, label, idx, v)).join("")}</div>`;
          }).join("");
          const note = cardState(card.id).note || "";
          return `<article class="card-block" id="${esc(card.id)}">
            <div class="row">
              <div class="mock">${mockHtml(card.mock)}</div>
              <div class="meta">
                <h3>${esc(card.name)}</h3>
                <p class="when">Triggered: ${esc(card.when)}</p>
                ${card.notes && card.notes.length ? `<div class="notes"><div class="lbl">Notes</div><ul>${card.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul></div>` : ""}
              </div>
            </div>
            <div class="bank">
              <div class="bank-h">Copy bank — rotate A / B / C</div>
              <div class="cols ${split ? "split" : ""}">${cols}</div>
              <textarea class="note-box" data-note="${esc(card.id)}" placeholder="Note for this card (optional)">${esc(note)}</textarea>
            </div>
          </article>`;
        }).join("");
        return `<section id="s${i}"><h2>${esc(section.section)}</h2>${section.note ? `<p class="section-note">${esc(section.note)}</p>` : ""}${cards}</section>`;
      }).join("");
    }

    render();

    document.getElementById("who").addEventListener("input", (e) => {
      state.who = e.target.value;
      save(state);
    });

    document.getElementById("app").addEventListener("input", (e) => {
      const t = e.target;
      if (t.dataset.note) {
        cardState(t.dataset.note).note = t.value;
        save(state);
        return;
      }
      if (!t.dataset.card) return;
      const cs = cardState(t.dataset.card);
      if (!cs.values[t.dataset.key]) cs.values[t.dataset.key] = { title: "", line: "" };
      cs.values[t.dataset.key][t.dataset.field] = t.value;
      save(state);
    });

    document.getElementById("app").addEventListener("change", (e) => {
      const t = e.target;
      if (t.type === "radio" && t.name.startsWith("pick-")) {
        cardState(t.name.slice(5)).pick = t.value;
        save(state);
      }
    });

    document.getElementById("download").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify({ who: state.who || "", savedAt: new Date().toISOString(), edits: state }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "totl-copy-bank-edits.json";
      a.click();
    });

    document.getElementById("reset").addEventListener("click", () => {
      if (!confirm("Reset every card to the original A / B / C?")) return;
      const who = state.who;
      state = who ? { who } : {};
      save(state);
      render();
    });
  </script>
