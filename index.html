<!doctype html>
<html lang="en">
  <head>
    <!-- Google Analytics (gtag.js) is loaded conditionally at runtime in `src/main.tsx`
         (web only; never in Despia/native) to avoid DNS/noise in webviews. -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/badges/totl-logo1.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f6" />
    <!-- Pin window scroll + size #root before React. Never touch .app-shell-scroll. -->
    <script>
      (function () {
        try {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        } catch (e) {}
        var lastH = -1;
        var startedAt = Date.now();
        var SETTLE_MS = 6000;
        function apply() {
          if (window.scrollY || window.pageYOffset) window.scrollTo(0, 0);
          if (document.documentElement) document.documentElement.scrollTop = 0;
          if (document.body) document.body.scrollTop = 0;
          var vv = window.visualViewport;
          var vvH = (vv && vv.height) || 0;
          var innerH = window.innerHeight || 0;
          var clientH = (document.documentElement && document.documentElement.clientHeight) || 0;
          var h = Math.max(1, Math.round(Math.max(vvH, innerH, clientH)));
          if (Date.now() - startedAt < SETTLE_MS && lastH > 0) h = Math.max(h, lastH);
          if (h === lastH) return;
          lastH = h;
          document.documentElement.style.setProperty('--app-height', h + 'px');
          document.documentElement.style.setProperty('--app-offset-top', '0px');
          var root = document.getElementById('root');
          if (root) {
            root.style.position = 'fixed';
            root.style.left = '0';
            root.style.right = '0';
            root.style.width = '100%';
            root.style.top = '0';
            root.style.bottom = '0';
            root.style.height = h + 'px';
            root.style.minHeight = h + 'px';
            root.style.maxHeight = 'none';
          }
        }
        apply();
        window.addEventListener('resize', apply);
        window.addEventListener('load', apply);
        window.addEventListener('pageshow', apply);
        window.addEventListener('scroll', apply, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', apply);
        }
        [0, 50, 100, 250, 500, 1000, 2000, 4000].forEach(function (ms) {
          setTimeout(apply, ms);
        });
        var poll = setInterval(apply, 200);
        setTimeout(function () { clearInterval(poll); }, 6000);
      })();
    </script>
    <!-- Preload critical fonts to prevent layout shift / FOUT -->
    <link rel="preload" href="/Fonts/Gramatika-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/Gramatika-Medium.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/Gramatika-Bold.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <title>TotL</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
