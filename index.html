<!doctype html>
<html lang="en">
  <head>
    <!-- Google Analytics (gtag.js) is loaded conditionally at runtime in `src/main.tsx`
         (web only; never in Despia/native) to avoid DNS/noise in webviews. -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/badges/totl-logo1.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f6" />
    <!-- Pin window scroll only. Do NOT set #root height from JS (causes link-open gap). -->
    <script>
      (function () {
        try {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        } catch (e) {}
        function pin() {
          if (window.scrollY || window.pageYOffset) window.scrollTo(0, 0);
          if (document.documentElement) document.documentElement.scrollTop = 0;
          if (document.body) document.body.scrollTop = 0;
        }
        pin();
        window.addEventListener('scroll', pin, { passive: true });
        window.addEventListener('pageshow', pin);
        window.addEventListener('load', pin);
      })();
    </script>
    <!-- Preload critical fonts to prevent layout shift / FOUT -->
    <link rel="preload" href="/Fonts/Gramatika-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/Gramatika-Medium.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/Gramatika-Bold.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <title>TotL</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
