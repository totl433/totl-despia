<!doctype html>
<html lang="en">
  <head>
    <!-- Google Analytics (gtag.js) is loaded conditionally at runtime in `src/main.tsx`
         (web only; never in Despia/native) to avoid DNS/noise in webviews. -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/badges/totl-logo1.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Keep shell at top:0; pin window scroll. Never set --app-offset-top from Safari. -->
    <script>
      (function () {
        try {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        } catch (e) {}
        // Pin window scroll only for the mobile app shell (matches viewportHeight.ts and the
        // max-width: 1023.98px CSS); desktop pages scroll the document normally.
        var mobileShell = window.matchMedia ? window.matchMedia('(max-width: 1023.98px)') : null;
        function apply() {
          var vv = window.visualViewport;
          if (
            (!mobileShell || mobileShell.matches) &&
            ((vv && vv.offsetTop > 0) || window.scrollY || window.pageYOffset)
          ) {
            window.scrollTo(0, 0);
          }
          var h = Math.max(1, Math.round((vv && vv.height) || window.innerHeight));
          document.documentElement.style.setProperty('--app-height', h + 'px');
          document.documentElement.style.setProperty('--app-offset-top', '0px');
        }
        apply();
        window.addEventListener('resize', apply);
        window.addEventListener('scroll', apply, { passive: true });
        window.addEventListener('pageshow', apply);
        document.addEventListener('touchend', apply, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', apply);
          window.visualViewport.addEventListener('scroll', apply);
        }
        setTimeout(apply, 50);
        setTimeout(apply, 300);
        setTimeout(apply, 1000);
      })();
    </script>
    <!-- Preload critical fonts to prevent layout shift / FOUT -->
    <link rel="preload" href="/Fonts/Gramatika-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/Gramatika-Medium.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/Gramatika-Bold.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <title>TotL</title>
