<!doctype html>
<html lang="en">
  <head>
    <!-- Google Analytics (gtag.js) is loaded conditionally at runtime in `src/main.tsx`
         (web only; never in Despia/native) to avoid DNS/noise in webviews. -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/badges/totl-logo1.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Keep shell at top:0; pin window scroll. Never set --app-offset-top from Safari. -->
    <script>
      (function () {
        try {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        } catch (e) {}
        // Pin window scroll only for the mobile app shell (matches viewportHeight.ts and the
        // max-width: 1023.98px CSS); desktop pages scroll the document normally.
        var mobileShell = window.matchMedia ? window.matchMedia('(max-width: 1023.98px)') : null;
        function apply() {
          var vv = window.visualViewport;
          if (
            (!mobileShell || mobileShell.matches) &&
            ((vv && vv.offsetTop > 0) || window.scrollY || window.pageYOffset)
          ) {
            window.scrollTo(0, 0);
          }
          var h = Math.max(1, Math.round((vv && vv.height) || window.innerHeight));
          document.documentElement.style.setProperty('--app-height', h + 'px');
          document.documentElement.style.setProperty('--app-offset-top', '0px');
        }
        apply();
        window.addEventListener('resize', apply);
        window.addEventListener('scroll', apply, { passive: true });
        window.addEventListener('pageshow', apply);
        document.addEventListener('touchend', apply, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', apply);
          window.visualViewport.addEventListener('scroll', apply);
        }
        setTimeout(apply, 50);
        setTimeout(apply, 300);
        setTimeout(apply, 1000);
      })();
    </script>
    <!-- Preload critical fonts to prevent layout shift / FOUT -->
    <link rel="preload" href="/Fonts/Gramatika-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/Gramatika-Medium.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/Gramatika-Bold.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <title>TOTL: Top of the League — Premier League prediction game</title>

    <meta name="description" content="Predict football results, take on your mates and climb the leaderboards." />

         wrongly point every route at "/". -->

    <meta property="og:site_name" content="TOTL" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://playtotl.com/" />
    <meta property="og:title" content="TOTL — Think You Know Football?" />
    <meta property="og:description" content="Predict football results, take on your mates and climb the leaderboards." />
    <meta property="og:image" content="https://playtotl.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://playtotl.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TOTL: Premier League predictions, mini leagues and bragging rights, shown on two iPhones." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TOTL — Think You Know Football?" />
    <meta name="twitter:description" content="Predict football results, take on your mates and climb the leaderboards." />
    <meta name="twitter:image" content="https://playtotl.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="TOTL: Premier League predictions, mini leagues and bragging rights, shown on two iPhones." />
    <!-- Apple Smart App Banner (iOS Safari): links to the App Store listing. -->
    <meta name="apple-itunes-app" content="app-id=6754661450" />

         Facts from the App Store / Google Play listings; no ratings or download counts. -->

            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" }

  </head>

</html>
