<!doctype html>
<html lang="en">
  <head>
    <!-- Google Analytics (gtag.js) is loaded conditionally at runtime in `src/main.tsx`
         (web only; never in Despia/native) to avoid DNS/noise in webviews. -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/badges/totl-logo1.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Sync --app-height before paint. First iOS load often undersizes; take max. -->
    <script>
      (function () {
        var started = Date.now();
        var lastH = 0;
        function apply() {
          var vv = window.visualViewport;
          if (window.scrollY || window.pageYOffset) {
            window.scrollTo(0, 0);
          }
          var vvH = (vv && vv.height) || window.innerHeight;
          var innerH = window.innerHeight;
          var clientH = document.documentElement.clientHeight || 0;
          var settling = Date.now() - started < 4000;
          // Prefer the larger reading on first load so we don’t leave a white gap
          var h = Math.max(1, Math.round(settling ? Math.max(vvH, innerH, clientH, lastH) : Math.min(vvH, innerH)));
          if (settling) lastH = Math.max(lastH, h);
          var offset = Math.max(0, Math.round((vv && vv.offsetTop) || 0));
          document.documentElement.style.setProperty('--app-height', h + 'px');
          document.documentElement.style.setProperty('--app-offset-top', offset + 'px');
        }
        apply();
        window.addEventListener('resize', apply);
        window.addEventListener('scroll', apply, { passive: true });
        document.addEventListener('touchstart', apply, { passive: true });
        document.addEventListener('touchend', apply, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', apply);
          window.visualViewport.addEventListener('scroll', apply);
        }
        var times = [0, 50, 100, 250, 500, 1000, 2000, 3500];
        times.forEach(function (ms) { setTimeout(apply, ms); });
        var poll = setInterval(apply, 100);
        setTimeout(function () { clearInterval(poll); }, 5000);
      })();
    </script>
    <!-- Preload critical fonts to prevent layout shift / FOUT -->
    <link rel="preload" href="/Fonts/Gramatika-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/Gramatika-Medium.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/Gramatika-Bold.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/Fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <title>TotL</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
